<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>Bússola</title>
<style>
  :root { --bg:#0b1220; --fg:#e8eef9; --mut:#8fa0bd; --acc:#ff4d4d; --card:#141d31; --line:#26324d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,Roboto,sans-serif; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; align-items:center; padding:12px 14px calc(14px + env(safe-area-inset-bottom)); gap:10px; }
  .row { width:100%; max-width:440px; display:flex; gap:8px; }
  select,input { flex:1; min-width:0; background:var(--card); color:var(--fg); border:1px solid var(--line);
    border-radius:10px; padding:11px 10px; font-size:16px; }
  #manual { display:none; }
  #heading { font-size:56px; font-weight:700; line-height:1; margin-top:4px; font-variant-numeric:tabular-nums; }
  #cardinal { font-size:20px; color:var(--mut); margin-left:6px; }
  #dialWrap { position:relative; width:min(88vw,380px); aspect-ratio:1; }
  #dial { width:100%; height:100%; transition:none; will-change:transform; }
  #lubber { position:absolute; left:50%; top:-4px; transform:translateX(-50%); width:0; height:0;
    border-left:10px solid transparent; border-right:10px solid transparent; border-top:18px solid var(--acc); }
  .seg { display:flex; width:100%; max-width:440px; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { flex:1; background:var(--card); color:var(--mut); border:0; padding:12px 6px; font-size:15px; }
  .seg button.on { background:#22407a; color:#fff; font-weight:600; }
  #info { width:100%; max-width:440px; font-size:14px; color:var(--mut); text-align:center; line-height:1.4; }
  #warn { width:100%; max-width:440px; font-size:14px; color:#ffcf66; text-align:center; min-height:1.2em; }
  .dim { color:var(--fg); }
</style>
</head>
<body>
  <div class="row">
    <select id="region" aria-label="Região"></select>
  </div>
  <div class="row" id="manual">
    <input id="lat" inputmode="decimal" placeholder="Latitude (ex.: -2,53)">
    <input id="lon" inputmode="decimal" placeholder="Longitude (ex.: -44,30)">
  </div>
  <div class="seg" role="group" aria-label="Referência do norte">
    <button id="bTrue" class="on">Norte verdadeiro</button>
    <button id="bMag">Norte magnético</button>
  </div>
  <div><span id="heading">--°</span><span id="cardinal"></span></div>
  <div id="dialWrap">
    <div id="lubber"></div>
    <svg id="dial" viewBox="-200 -200 400 400" aria-hidden="true"></svg>
  </div>
  <div id="warn"></div>
  <div id="info">Aguardando sensor…</div>
<script src="wmm.js"></script>
<script src="app.js"></script>
</body>
</html>
