<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Bússola</title>
<style>
  :root { --bg:#0b1220; --fg:#e8eef9; --mut:#8fa0bd; --acc:#ff4d4d; --ok:#3ddc84; --card:#141d31; --line:#26324d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,Roboto,sans-serif; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; align-items:center; padding:10px 12px calc(12px + env(safe-area-inset-bottom)); gap:8px; }
  .row { width:100%; max-width:440px; display:flex; gap:8px; }
  select,input { flex:1; min-width:0; background:var(--card); color:var(--fg); border:1px solid var(--line);
    border-radius:10px; padding:10px; font-size:16px; }
  #manual { display:none; }
  #heading { font-size:50px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
  #cardinal { font-size:20px; color:var(--mut); margin-left:6px; }
  #dialWrap { position:relative; width:min(76vw,320px); aspect-ratio:1; margin-top:2px; }
  #dial { width:100%; height:100%; will-change:transform; }
  #lubber { position:absolute; left:50%; top:-4px; transform:translateX(-50%); width:0; height:0;
    border-left:9px solid transparent; border-right:9px solid transparent; border-top:16px solid var(--acc); }
  .seg { display:flex; width:100%; max-width:440px; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { flex:1; background:var(--card); color:var(--mut); border:0; padding:11px 6px; font-size:15px; }
  .seg button.on { background:#22407a; color:#fff; font-weight:600; }
  .cards { width:100%; max-width:440px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 10px; min-width:0; }
  .card h2 { margin:0 0 6px; font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--mut); }
  .card .v { font-size:13px; line-height:1.45; color:var(--fg); font-variant-numeric:tabular-nums; word-break:break-word; }
  .card .m { color:var(--mut); }
  #lvlSvg { display:block; width:100%; max-width:118px; aspect-ratio:1; margin:0 auto 4px; }
  #lvlTxt { text-align:center; font-size:13px; font-variant-numeric:tabular-nums; }
  #lvlTxt.ok { color:var(--ok); font-weight:600; }
  #gpsBtn { margin-top:6px; width:100%; background:#22407a; color:#fff; border:0; border-radius:8px; padding:9px 6px; font-size:14px; }
  #info { width:100%; max-width:440px; font-size:13px; color:var(--mut); text-align:center; line-height:1.4; }
  #warn { width:100%; max-width:440px; font-size:13px; color:#ffcf66; text-align:center; }
  #warn:empty { display:none; }
  .dim { color:var(--fg); }
  #ver { font-size:11px; color:#56648a; }
</style>
</head>
<body>
  <div class="row">
    <select id="region" aria-label="Região"></select>
  </div>
  <div class="row" id="manual">
    <input id="lat" inputmode="decimal" placeholder="Latitude (ex.: -2,53)">
    <input id="lon" inputmode="decimal" placeholder="Longitude (ex.: -44,30)">
  </div>
  <div class="seg" role="group" aria-label="Referência do norte">
    <button id="bTrue" class="on">Norte verdadeiro</button>
    <button id="bMag">Norte magnético</button>
  </div>
  <div><span id="heading">--°</span><span id="cardinal"></span></div>
  <div id="dialWrap">
    <div id="lubber"></div>
    <svg id="dial" viewBox="-200 -200 400 400" aria-hidden="true"></svg>
  </div>
  <div id="info">Aguardando sensor…</div>
  <div id="warn"></div>

  <div class="cards">
    <div class="card">
      <h2>Nível</h2>
      <svg id="lvlSvg" viewBox="-60 -60 120 120" aria-hidden="true">
        <circle r="56" fill="#101a2e" stroke="#26324d" stroke-width="2"/>
        <circle r="23" fill="none" stroke="#26324d" stroke-width="1.5"/>
        <line x1="-56" y1="0" x2="56" y2="0" stroke="#26324d" stroke-width="1.5"/>
        <line x1="0" y1="-56" x2="0" y2="56" stroke="#26324d" stroke-width="1.5"/>
        <circle r="8" fill="none" stroke="#5b6b8c" stroke-width="2"/>
        <circle id="bubble" r="8" cx="0" cy="0" fill="#ff4d4d" fill-opacity=".85"/>
      </svg>
      <div id="lvlTxt">--</div>
    </div>
    <div class="card">
      <h2>GPS</h2>
      <div class="v" id="gpsTxt">Desligado</div>
      <button id="gpsBtn">Ativar GPS</button>
    </div>
  </div>
  <div id="ver"></div>
<script src="wmm.js"></script>
<script src="app.js"></script>
</body>
</html>
